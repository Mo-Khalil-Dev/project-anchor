version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    container_name: bridge-postgres
    environment:
      POSTGRES_DB: bridge
      POSTGRES_USER: bridge_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_user -d bridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bridge-backend
    environment:
      NODE_ENV: development
      RUNTIME: docker
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://bridge_user:dev_password@postgres:5432/bridge
      PORT: 3000
      LOG_LEVEL: debug
      JWT_SECRET: dev_secret_key_docker_change_in_production
      COGNITO_USER_POOL_ID: local-test
      COGNITO_CLIENT_ID: local-test
      COGNITO_REGION: us-east-1
      AWS_REGION: us-east-1
      TINK_CLIENT_ID: local-test
      TINK_CLIENT_SECRET: local-test
      TINK_ENVIRONMENT: sandbox
      TINK_LINK_BASE_URL: https://link.tink.com
      TINK_API_BASE_URL: https://api.tink.com/api/v1
      TINK_EXPENSES_API_BASE_URL: https://api.tink.com/risk/v1
      SES_FROM_ADDRESS: noreply@bridge.local
      STRIPE_SECRET_KEY: sk_test_local
      STRIPE_WEBHOOK_SECRET: whsec_local
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: bridge-network
