version: '3.9'

services:
  app:
    build: .
    container_name: bridge-backend
    environment:
      NODE_ENV: development
      RUNTIME: docker
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./prisma/dev.db
      PORT: 3000
      LOG_LEVEL: debug
      JWT_SECRET: dev_secret_key_change_in_production
      COGNITO_USER_POOL_ID: local-test
      COGNITO_CLIENT_ID: local-test
      COGNITO_REGION: us-east-1
      AWS_REGION: us-east-1
      TINK_CLIENT_ID: 9151e92cb2b9493085f79da6abaa0ba8
      TINK_CLIENT_SECRET: a3ea38094cdc4b4f88fee4b3bc2a9771
      TINK_ENVIRONMENT: sandbox
      TINK_LINK_BASE_URL: https://link.tink.com
      TINK_API_BASE_URL: https://api.tink.com/api/v1
      TINK_EXPENSES_API_BASE_URL: https://api.tink.com/risk/v1
      SES_FROM_ADDRESS: noreply@bridge.local
      STRIPE_SECRET_KEY: sk_test_local
      STRIPE_WEBHOOK_SECRET: whsec_local
      FRONTEND_URL: http://localhost:5173
      REDIRECT_URL: http://localhost:3000/api/bank-connections/callback
      ENABLE_ERROR_STACK_TRACES: false
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma
    command: node dist/index.js
