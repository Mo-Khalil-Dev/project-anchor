<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge — Support Services</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SERVICES = [
  {
    tag:'Energy', tagColor:Bridge.amber,
    title:'Warm Home Discount',
    value:'£140 off your bill',
    desc:'A government scheme that provides a one-off discount on your energy bill. Based on your income level and household, you are likely eligible.',
    eligibility:'Low income · Energy bill arrears',
    cta:'Apply Now', ctaVariant:'primary',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke={Bridge.amber} strokeWidth="1.7" fill={Bridge.amberBg}/><circle cx="12" cy="9" r="2.5" stroke={Bridge.amber} strokeWidth="1.5" fill={Bridge.amberBg}/></svg>,
  },
  {
    tag:'Energy', tagColor:Bridge.amber,
    title:'Energy Efficiency Grants',
    value:'Up to £10,000',
    desc:'Government-funded home improvements (insulation, boiler upgrades) that reduce your energy bills long-term. Free assessment available.',
    eligibility:'Rented or owned property · Low to medium income',
    cta:'Learn More', ctaVariant:'ghost',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke={Bridge.amber} strokeWidth="1.7" fill={Bridge.amberBg}/><path d="M9 22V12h6v10" stroke={Bridge.amber} strokeWidth="1.5"/></svg>,
  },
  {
    tag:'Benefits', tagColor:Bridge.accent,
    title:'Benefits Entitlement Check',
    value:'Potential £200–£800/mo extra',
    desc:'Many people are not claiming all the benefits they're entitled to. A free check could reveal Universal Credit, Housing Benefit or Council Tax Reduction you're missing.',
    eligibility:'Any income level — many underclaim',
    cta:'Check Now', ctaVariant:'primary',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke={Bridge.accent} strokeWidth="1.7" fill={Bridge.accentBg}/><path d="M7 10h5M7 14h3" stroke={Bridge.accent} strokeWidth="1.5" strokeLinecap="round"/><path d="M17 10l-3 4-1-2" stroke={Bridge.green} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  },
  {
    tag:'Council', tagColor:Bridge.green,
    title:'Council Tax Reduction',
    value:'Up to 100% reduction',
    desc:'If you're on a low income or certain benefits, you may pay little or no council tax. Apply through your local council — takes about 20 minutes.',
    eligibility:'Low income · Benefits claimants',
    cta:'Check Eligibility', ctaVariant:'ghost',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2 7l10-5 10 5v2H2V7z" fill={Bridge.greenBg} stroke={Bridge.green} strokeWidth="1.5"/><rect x="4" y="9" width="4" height="10" rx="1" fill={Bridge.greenBg} stroke={Bridge.green} strokeWidth="1.3"/><rect x="10" y="9" width="4" height="10" rx="1" fill={Bridge.greenBg} stroke={Bridge.green} strokeWidth="1.3"/><rect x="16" y="9" width="4" height="10" rx="1" fill={Bridge.greenBg} stroke={Bridge.green} strokeWidth="1.3"/><rect x="2" y="19" width="20" height="2" rx="1" fill={Bridge.green}/></svg>,
  },
  {
    tag:'Debt', tagColor:Bridge.red,
    title:'Free Debt Advice — StepChange',
    value:'Free, confidential, no pressure',
    desc:'StepChange is the UK\'s leading debt charity. They can negotiate with creditors, set up Debt Management Plans and provide personal advice — all free of charge.',
    eligibility:'Anyone with debt concerns',
    cta:'Contact StepChange', ctaVariant:'ghost',
    icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke={Bridge.red} strokeWidth="1.7" fill={Bridge.redBg}/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7" stroke={Bridge.red} strokeWidth="1.7" strokeLinecap="round"/></svg>,
  },
];

function ServiceCard({ s }) {
  return (
    <div style={{background:'#fff',borderRadius:16,padding:'22px 22px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)',display:'grid',gridTemplateColumns:'auto 1fr auto',gap:16,alignItems:'start'}}>
      <div style={{width:46,height:46,borderRadius:14,background:Bridge.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>{s.icon}</div>
      <div>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:100,background:`${s.tagColor}18`,color:s.tagColor,textTransform:'uppercase',letterSpacing:'0.06em'}}>{s.tag}</span>
          <span style={{fontSize:13,fontWeight:700,color:Bridge.text}}>{s.title}</span>
        </div>
        <div style={{fontSize:15,fontWeight:700,color:s.tagColor,marginBottom:6}}>{s.value}</div>
        <div style={{fontSize:13,color:Bridge.sub,lineHeight:1.55,marginBottom:8}}>{s.desc}</div>
        <div style={{fontSize:12,color:Bridge.muted}}>Eligibility: {s.eligibility}</div>
      </div>
      <Btn variant={s.ctaVariant} small>{s.cta}</Btn>
    </div>
  );
}

function App() {
  return (
    <CustomerLayout title="Support Services for You" subtitle="Based on your financial profile, these services may reduce your costs or provide additional support. All are free.">
      <div style={{background:Bridge.accentBg,border:`1px solid ${Bridge.accent}25`,borderRadius:14,padding:'14px 18px',marginBottom:22,fontSize:13.5,color:Bridge.accent,display:'flex',gap:10,alignItems:'center'}}>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke={Bridge.accent} strokeWidth="1.5"/><path d="M9 8v4M9 6.5v.5" stroke={Bridge.accent} strokeWidth="1.5" strokeLinecap="round"/></svg>
        We've matched 5 services to your profile. These are suggestions only — applying is entirely your choice.
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:24}}>
        {SERVICES.map(s=><ServiceCard key={s.title} s={s}/>)}
      </div>
      <Btn variant="primary" full>Continue to Payment Plan Setup</Btn>
    </CustomerLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
