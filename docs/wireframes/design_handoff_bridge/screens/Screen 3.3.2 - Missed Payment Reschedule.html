<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge — Reschedule Payment</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

const REASONS = [
  { id:'delay', label:'Payment is coming — just delayed', desc:'I have the money, it\'s coming within a few days.' },
  { id:'expense', label:'Unexpected expense this month', desc:'An unplanned cost has temporarily affected my budget.' },
  { id:'job', label:'Change in job or income', desc:'My employment or income situation has changed.' },
  { id:'other', label:'Other reason', desc:'Something else has made it difficult this month.' },
];
const RESCHEDULE_OPTIONS = [
  { id:'asap', label:'Pay as soon as possible', date:'22 April 2026', note:'5 days from today' },
  { id:'next', label:'Combine with next month', date:'15 May 2026', note:'Pay £70 on next payment date' },
  { id:'extend', label:'Extend the plan by 1 month', date:'15 May 2026 onwards', note:'Adds 1 month, reduces monthly pressure' },
];

function App() {
  const [reason, setReason] = useState(null);
  const [reschedule, setReschedule] = useState('asap');
  const step = reason ? 2 : 1;
  return (
    <CustomerLayout title={step===1 ? "We noticed a missed payment" : "Let's reschedule your payment"} subtitle={step===1 ? "That's okay — life happens. Help us understand what happened so we can find the best solution." : "No penalties for rescheduling. Choose what works best for you."}>

      {step === 1 && (
        <>
          <Card style={{padding:'16px 20px',marginBottom:20,background:Bridge.amberBg,border:`1px solid ${Bridge.amber}30`}}>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke={Bridge.amber} strokeWidth="1.5"/><path d="M10 6v5M10 13.5v.5" stroke={Bridge.amber} strokeWidth="1.5" strokeLinecap="round"/></svg>
              <div><span style={{fontSize:13.5,fontWeight:600,color:'oklch(45% 0.16 76)'}}>April payment of £35.00 was missed on 15 April 2026.</span><span style={{fontSize:13,color:'oklch(45% 0.16 76)'}}> This is your first missed payment — no penalties applied.</span></div>
            </div>
          </Card>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:24}}>
            {REASONS.map(r=>(
              <div key={r.id} onClick={()=>setReason(r.id)} style={{background:'#fff',borderRadius:14,padding:'16px 20px',border:`${reason===r.id?2:1.5}px solid ${reason===r.id?Bridge.accent:Bridge.border}`,cursor:'pointer',display:'grid',gridTemplateColumns:'auto 1fr auto',gap:14,alignItems:'center',transition:'all 0.12s',boxShadow:reason===r.id?`0 3px 12px ${Bridge.accent}18`:'0 1px 3px rgba(0,0,0,0.05)'}}>
                <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${reason===r.id?Bridge.accent:Bridge.border}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {reason===r.id && <div style={{width:10,height:10,borderRadius:'50%',background:Bridge.accent}}/>}
                </div>
                <div>
                  <div style={{fontSize:14,fontWeight:600,color:Bridge.text,marginBottom:3}}>{r.label}</div>
                  <div style={{fontSize:12.5,color:Bridge.sub}}>{r.desc}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <Btn variant="primary" full disabled={!reason}>Continue</Btn>
            <Btn variant="secondary" full>Talk to an Adviser</Btn>
          </div>
        </>
      )}

      {step === 2 && (
        <>
          <div style={{background:Bridge.accentBg,borderRadius:12,padding:'12px 16px',marginBottom:20,fontSize:13.5,color:Bridge.accent,display:'flex',gap:8,alignItems:'center'}}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3l5 10H3L8 3z" stroke={Bridge.accent} strokeWidth="1.4" strokeLinejoin="round"/><path d="M8 7v3M8 11.5v.5" stroke={Bridge.accent} strokeWidth="1.3" strokeLinecap="round"/></svg>
            Reason noted: <strong>{REASONS.find(r=>r.id===reason)?.label}</strong>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:24}}>
            {RESCHEDULE_OPTIONS.map(o=>(
              <div key={o.id} onClick={()=>setReschedule(o.id)} style={{background:'#fff',borderRadius:14,padding:'18px 20px',border:`${reschedule===o.id?2:1.5}px solid ${reschedule===o.id?Bridge.accent:Bridge.border}`,cursor:'pointer',display:'grid',gridTemplateColumns:'auto 1fr',gap:14,alignItems:'start',transition:'all 0.12s'}}>
                <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${reschedule===o.id?Bridge.accent:Bridge.border}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
                  {reschedule===o.id && <div style={{width:10,height:10,borderRadius:'50%',background:Bridge.accent}}/>}
                </div>
                <div>
                  <div style={{fontSize:14,fontWeight:600,color:Bridge.text,marginBottom:3}}>{o.label}</div>
                  <div style={{fontSize:13,fontWeight:600,color:Bridge.accent,marginBottom:3}}>{o.date}</div>
                  <div style={{fontSize:12.5,color:Bridge.sub}}>{o.note}</div>
                </div>
              </div>
            ))}
          </div>
          <Card style={{padding:'16px 20px',marginBottom:20,background:Bridge.greenBg,border:`1px solid ${Bridge.green}20`}}>
            <div style={{fontSize:13,color:'oklch(38% 0.17 145)',lineHeight:1.55}}>
              <strong>Updated plan:</strong> With this change, your plan completes by <strong>15 May 2027</strong> (one month later). No penalties. No credit impact.
            </div>
          </Card>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <Btn variant="primary" full>Confirm Reschedule</Btn>
            <Btn variant="secondary" full>Talk to an Adviser</Btn>
          </div>
        </>
      )}
    </CustomerLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
