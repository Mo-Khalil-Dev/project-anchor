<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge Admin — Compliance</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

function StatusDot({ ok }) {
  return <span style={{width:8,height:8,borderRadius:'50%',background:ok?Bridge.green:Bridge.amber,display:'inline-block',flexShrink:0}}/>;
}

function MetricRow({ label, value, target, ok, note }) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:`1px solid ${Bridge.divider}`}}>
      <StatusDot ok={ok}/>
      <div style={{flex:1}}>
        <div style={{fontSize:13.5,color:Bridge.text,fontWeight:500}}>{label}</div>
        {note && <div style={{fontSize:12,color:Bridge.muted,marginTop:2}}>{note}</div>}
      </div>
      <div style={{textAlign:'right'}}>
        <div style={{fontSize:14,fontWeight:700,color:ok?Bridge.green:Bridge.amber}}>{value}</div>
        {target && <div style={{fontSize:11.5,color:Bridge.muted}}>Target: {target}</div>}
      </div>
    </div>
  );
}

function AuditTab() {
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:10,background:Bridge.accentBg,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 2L3 5v5c0 3.3 2.7 6.4 6 7 3.3-.6 6-3.7 6-7V5L9 2z" stroke={Bridge.accent} strokeWidth="1.6" fill="none" strokeLinejoin="round"/><path d="M6 9l2 2 4-4" stroke={Bridge.accent} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:Bridge.text}}>FCA Compliance</div>
          </div>
          <MetricRow label="Assessments with documented rationale" value="100%" target="100%" ok={true}/>
          <MetricRow label="Customers assessed on ability to pay" value="100%" target="100%" ok={true}/>
          <MetricRow label="Payment plans deemed sustainable" value="98%" target=">95%" ok={true}/>
          <MetricRow label="Average decision time" value="3.8 days" target="<5 days" ok={true}/>
          <MetricRow label="Customer complaints received" value="3" target="<5/month" ok={true} note="All resolved within 5 business days"/>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:10,background:Bridge.amberBg,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="8" r="3.5" stroke={Bridge.amber} strokeWidth="1.5"/><path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke={Bridge.amber} strokeWidth="1.5" strokeLinecap="round"/></svg>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:Bridge.text}}>Ofgem Vulnerable Customer Protection</div>
          </div>
          <MetricRow label="PSR customers identified & flagged" value="127" target="All eligible" ok={true}/>
          <MetricRow label="No-disconnection guarantees applied" value="89" target="All medical PSR" ok={true}/>
          <MetricRow label="Priority support assigned" value="95%" target=">90%" ok={true}/>
          <MetricRow label="Warm Home Discount offered" value="78%" target=">80%" ok={false} note="Below target — 3 eligible customers missed"/>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:10,background:Bridge.greenBg,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><rect x="2" y="4" width="14" height="11" rx="2" stroke={Bridge.green} strokeWidth="1.5"/><path d="M6 8h6M6 11h4" stroke={Bridge.green} strokeWidth="1.3" strokeLinecap="round"/></svg>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:Bridge.text}}>Fairness & Discrimination Check</div>
          </div>
          {[
            {label:'Approval rate variance by age group',value:'±2.1%',ok:true,note:'<5% variance is acceptable'},
            {label:'Approval rate variance by region',value:'±1.8%',ok:true,note:'No regional bias detected'},
            {label:'Approval rate variance by income band',value:'±3.2%',ok:true,note:'Within acceptable range'},
          ].map(r=><MetricRow key={r.label} {...r}/>)}
          <div style={{marginTop:16,background:Bridge.greenBg,borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:28,fontWeight:800,color:Bridge.green,letterSpacing:-1}}>0.89</div>
              <div style={{fontSize:11,color:Bridge.green,fontWeight:600}}>/1.0</div>
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:Bridge.text,marginBottom:4}}>Overall Fairness Score</div>
              <div style={{fontSize:12.5,color:Bridge.sub}}>Industry standard is 0.80+. Bridge scores 0.89 — above average.</div>
            </div>
          </div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
          <div style={{fontSize:14,fontWeight:700,color:Bridge.text,marginBottom:12}}>Audit Log Summary (last 30 days)</div>
          {[['Decisions made','451'],['Auto-approved','78%'],['Manually reviewed','22%'],['Escalated to senior officer','8%'],['Cases awaiting info','11'],['Average audit trail completeness','100%']].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:`1px solid ${Bridge.divider}`,fontSize:13.5}}>
              <span style={{color:Bridge.sub}}>{k}</span>
              <span style={{fontWeight:600,color:Bridge.text}}>{v}</span>
            </div>
          ))}
          <div style={{marginTop:14}}><span style={{fontSize:13,color:Bridge.accent,cursor:'pointer',fontWeight:600}}>Download full audit report (PDF) →</span></div>
        </div>
      </div>
    </div>
  );
}

function FlagAccuracyTab() {
  const flags = [
    {type:'High bill ratio (>200%)',issued:100,accurate:92,accuracy:92,status:'good',rec:null},
    {type:'Data quality issue',issued:45,accurate:35,accuracy:78,status:'warn',rec:'Threshold too sensitive — raise minimum score from 70 to 80.'},
    {type:'Previous default history',issued:60,accurate:57,accuracy:95,status:'good',rec:null},
    {type:'Income variance detected',issued:38,accurate:29,accuracy:76,status:'warn',rec:'Seasonal income patterns causing false positives — add seasonality adjustment.'},
    {type:'Vulnerability flag (PSR)',issued:127,accurate:124,accuracy:98,status:'good',rec:null},
  ];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {[{l:'Overall flag accuracy',v:'88%',c:Bridge.green},{l:'Flags requiring refinement',v:'2',c:Bridge.amber},{l:'False positives (last 30d)',v:'19',c:Bridge.amber}].map(s=>(
          <div key={s.l} style={{background:'#fff',borderRadius:14,padding:'18px',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
            <div style={{fontSize:26,fontWeight:800,color:s.c,letterSpacing:-0.5,marginBottom:4}}>{s.v}</div>
            <div style={{fontSize:13,color:Bridge.sub}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div style={{background:'#fff',borderRadius:14,overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr',gap:12,padding:'11px 20px',background:Bridge.bg,borderBottom:`1px solid ${Bridge.border}`}}>
          {['Flag type','Issued','Accurate','Accuracy','Status'].map(h=><div key={h} style={{fontSize:11.5,fontWeight:600,color:Bridge.muted,textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</div>)}
        </div>
        {flags.map((f,i)=>(
          <div key={i} style={{borderBottom:i<flags.length-1?`1px solid ${Bridge.divider}`:'none'}}>
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr 1fr',gap:12,padding:'14px 20px',alignItems:'center'}}>
              <div style={{fontSize:13.5,color:Bridge.text,fontWeight:500}}>{f.type}</div>
              <div style={{fontSize:14,color:Bridge.text}}>{f.issued}</div>
              <div style={{fontSize:14,color:Bridge.text}}>{f.accurate}</div>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:f.status==='good'?Bridge.green:Bridge.amber}}>{f.accuracy}%</div>
                <div style={{height:4,borderRadius:100,background:'#eee',marginTop:4,width:60,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${f.accuracy}%`,background:f.status==='good'?Bridge.green:Bridge.amber,borderRadius:100}}/>
                </div>
              </div>
              <span style={{display:'inline-flex',alignItems:'center',gap:5,background:f.status==='good'?Bridge.greenBg:Bridge.amberBg,color:f.status==='good'?Bridge.green:Bridge.amber,borderRadius:100,padding:'3px 10px',fontSize:11.5,fontWeight:700}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'currentColor'}}/>
                {f.status==='good'?'Accurate':'Needs tuning'}
              </span>
            </div>
            {f.rec && (
              <div style={{padding:'0 20px 14px',display:'flex',gap:10,alignItems:'flex-start'}}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{flexShrink:0,marginTop:1}}><circle cx="7" cy="7" r="6" stroke={Bridge.amber} strokeWidth="1.3"/><path d="M7 5v3M7 9.5v.5" stroke={Bridge.amber} strokeWidth="1.3" strokeLinecap="round"/></svg>
                <div style={{fontSize:12.5,color:Bridge.amber,lineHeight:1.5}}><strong>Recommendation:</strong> {f.rec}</div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab,setTab]=useState('audit');
  return (
    <AdminLayout active="compliance" title="Compliance Dashboard" subtitle="FCA · Ofgem · GDPR monitoring · April 2026">
      <Tabs tabs={[{id:'audit',label:'5.2.1 Audit Trail'},{id:'flags',label:'5.2.2 Flag Accuracy'}]} active={tab} onChange={setTab}/>
      {tab==='audit' && <AuditTab/>}
      {tab==='flags' && <FlagAccuracyTab/>}
    </AdminLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
