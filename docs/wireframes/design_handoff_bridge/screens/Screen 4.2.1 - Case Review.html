<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge Admin — Case Review</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

// ── Shared case header ─────────────────────────────────────────
function CaseHeader({ onAction }) {
  const actions = [
    { label:'Approve', v:'success' },
    { label:'Modify Plan', v:'primary' },
    { label:'Request Info', v:'ghost' },
    { label:'Escalate', v:'secondary' },
    { label:'Override', v:'danger' },
  ];
  return (
    <div style={{background:'#fff',borderRadius:16,padding:'18px 22px',marginBottom:20,display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 1px 4px rgba(0,0,0,0.06)',flexWrap:'wrap',gap:14}}>
      <div style={{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:18,fontWeight:800,color:Bridge.text,letterSpacing:-0.4}}>Sarah Mitchell</div>
          <div style={{fontSize:12.5,color:Bridge.muted,marginTop:2}}>Account #BR-2847 · Flagged 18 Apr 2026 · Barclays</div>
        </div>
        <HardshipBadge level="SEVERE"/>
        <span style={{background:Bridge.redBg,color:Bridge.red,fontSize:11.5,fontWeight:700,padding:'3px 10px',borderRadius:100}}>High Priority</span>
        <span style={{background:'#f4f4f8',color:Bridge.sub,fontSize:11.5,fontWeight:600,padding:'3px 10px',borderRadius:100}}>Waiting 2 days</span>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {actions.map(a=><Btn key={a.label} variant={a.v} small onClick={()=>onAction&&onAction(a.label)}>{a.label}</Btn>)}
      </div>
    </div>
  );
}

// ── Tab: Overview (4.2.1) ──────────────────────────────────────
function OverviewTab() {
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* Profile */}
        <Card style={{padding:'20px 22px'}}>
          <AdminSection title="Customer Profile">
            {[['Age','42'],['Household','Single adult, 1 child'],['PSR Status','Not registered'],['Employment','Part-time employed'],['Housing','Private rented'],['Language','English'],].map(([k,v])=>(
              <Row key={k}><span style={{fontSize:13.5,color:Bridge.sub}}>{k}</span><span style={{fontSize:13.5,fontWeight:600,color:Bridge.text}}>{v}</span></Row>
            ))}
          </AdminSection>
        </Card>
        {/* Why flagged */}
        <Card style={{padding:'20px 22px'}}>
          <AdminSection title="Why This Case Was Flagged">
            {[
              {text:'Bill ratio 323% — exceeds 200% severe threshold',color:Bridge.red},
              {text:'Previous payment plan default in 2023',color:Bridge.amber},
              {text:'Income variance detected (Nov spike)',color:Bridge.amber},
            ].map(f=>(
              <div key={f.text} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:`1px solid ${Bridge.divider}`,alignItems:'center'}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:f.color,flexShrink:0}}/>
                <span style={{fontSize:13.5,color:Bridge.sub}}>{f.text}</span>
              </div>
            ))}
          </AdminSection>
        </Card>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* Financial snapshot */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[{l:'Monthly Income',v:'£1,850',c:Bridge.green},{l:'Total Expenses',v:'£1,720',c:Bridge.amber},{l:'Disposable',v:'£130',c:Bridge.red},{l:'Bill Balance',v:'£420',c:Bridge.red}].map(s=>(
            <StatCard key={s.l} label={s.l} value={s.v} color={s.c}/>
          ))}
        </div>
        {/* System recommendation */}
        <Card style={{padding:'20px 22px',border:`1.5px solid ${Bridge.accent}25`,background:Bridge.accentBg}}>
          <AdminSection title="System Recommendation">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
              {[['Plan','Conservative'],['Monthly','£35/mo'],['Duration','12 months'],['Confidence','94%']].map(([k,v])=>(
                <div key={k}><div style={{fontSize:11,color:Bridge.accent,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{k}</div><div style={{fontSize:15,fontWeight:700,color:Bridge.text}}>{v}</div></div>
              ))}
            </div>
            <SustBadge level="HIGH"/>
          </AdminSection>
        </Card>
        {/* Data quality */}
        <Card style={{padding:'20px 22px'}}>
          <AdminSection title="Data Quality">
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:56,height:56,borderRadius:'50%',background:Bridge.greenBg,border:`3px solid ${Bridge.green}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <span style={{fontSize:16,fontWeight:800,color:Bridge.green}}>92</span>
              </div>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:Bridge.text,marginBottom:4}}>High quality data</div>
                <div style={{fontSize:12.5,color:Bridge.sub}}>186 transactions · 6 months · No gaps · Verified connection</div>
              </div>
            </div>
          </AdminSection>
        </Card>
      </div>
    </div>
  );
}

// ── Tab: Customer Context (4.2.2) ──────────────────────────────
function CustomerTab() {
  const Section = ({title,items}) => (
    <Card style={{padding:'18px 20px'}}>
      <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${Bridge.divider}`}}>{title}</div>
      {items.map(([k,v,flag])=>(
        <Row key={k}>
          <span style={{fontSize:13.5,color:Bridge.sub}}>{k}</span>
          <span style={{fontSize:13.5,fontWeight:600,color:flag?Bridge.amber:Bridge.text}}>{v}</span>
        </Row>
      ))}
    </Card>
  );
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Section title="Personal Information" items={[['Full name','Sarah Mitchell'],['Date of birth','12 Mar 1984 (age 42)'],['Address','14 Brook Lane, Manchester M14 7PQ'],['Phone','07700 900123'],['Email','sarah.mitchell@email.com'],['Preferred contact','Email']]}/>
        <Section title="Employment & Income" items={[['Employment status','Part-time employed'],['Employer','Retail (unnamed)'],['Hours/week','24 hours'],['Salary','£1,600/month net'],['Benefits','Universal Credit £250/month'],['Self-employed','No']]}/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Section title="Housing" items={[['Tenure','Private rented'],['Landlord type','Private landlord'],['Monthly rent','£850'],['Occupants','2 (adult + child)'],['Postcode deprivation','IMD Decile 4 — moderate deprivation']]}/>
        <Section title="Previous History" items={[['Previous arrears','Yes — 2022, £180 cleared'],['Previous plan default','Yes — 2023 (income loss)'],['Disputes','None on record'],['Account age','7 years'],['Credit flags','1 late payment 2023']]}/>
        <Card style={{padding:'18px 20px'}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10}}>Vulnerabilities Detected</div>
          {[
            {label:'Single parent household',color:Bridge.amber},
            {label:'Income below living wage threshold',color:Bridge.red},
            {label:'Previous plan default',color:Bridge.amber},
          ].map(v=>(
            <div key={v.label} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:`1px solid ${Bridge.divider}`,alignItems:'center'}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:v.color,flexShrink:0}}/>
              <span style={{fontSize:13.5,color:Bridge.text}}>{v.label}</span>
              <span style={{marginLeft:'auto',fontSize:11.5,padding:'2px 8px',borderRadius:100,background:`${v.color}18`,color:v.color,fontWeight:600}}>Flagged</span>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}

// ── Tab: Financial (4.2.3) ─────────────────────────────────────
function FinancialTab() {
  const income = [{l:'Salary (part-time)',v:'£1,600'},{l:'Universal Credit',v:'£250'},{l:'Total',v:'£1,850',bold:true}];
  const expenses = [{l:'Housing (rent)',v:'£850'},{l:'Food & groceries',v:'£320'},{l:'Transport',v:'£220'},{l:'Utilities (ex. energy)',v:'£180'},{l:'Other essentials',v:'£150'},{l:'Total',v:'£1,720',bold:true}];
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'18px 20px'}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10}}>Income Breakdown</div>
          {income.map(r=>(
            <Row key={r.l}><span style={{fontSize:13.5,color:r.bold?Bridge.text:Bridge.sub,fontWeight:r.bold?700:400}}>{r.l}</span><span style={{fontSize:13.5,fontWeight:700,color:r.bold?Bridge.green:Bridge.text}}>{r.v}</span></Row>
          ))}
        </Card>
        <Card style={{padding:'18px 20px'}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10}}>Expense Breakdown</div>
          {expenses.map(r=>(
            <Row key={r.l}><span style={{fontSize:13.5,color:r.bold?Bridge.text:Bridge.sub,fontWeight:r.bold?700:400}}>{r.l}</span><span style={{fontSize:13.5,fontWeight:700,color:r.bold?Bridge.amber:Bridge.text}}>{r.v}</span></Row>
          ))}
        </Card>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 22px'}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:12}}>Disposable Income Calculation</div>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:16}}>
            {[['£1,850',Bridge.green,'Income'],['−','',''],['£1,720',Bridge.amber,'Expenses'],['=','',''],['£130',Bridge.red,'Disposable']].map((item,i)=>{
              if(item[0]==='−'||item[0]==='=') return <span key={i} style={{fontSize:24,color:Bridge.muted,fontWeight:300}}>{item[0]}</span>;
              return <div key={i} style={{background:`${item[1]}18`,borderRadius:10,padding:'8px 12px',textAlign:'center'}}><div style={{fontSize:18,fontWeight:800,color:item[1]}}>{item[0]}</div><div style={{fontSize:10.5,color:item[1],fontWeight:600,textTransform:'uppercase',marginTop:2}}>{item[2]}</div></div>;
            })}
          </div>
          <div style={{fontSize:13,color:Bridge.sub,marginBottom:8}}>Bill as % of disposable income:</div>
          <div style={{fontSize:32,fontWeight:800,color:Bridge.red,letterSpacing:-1}}>323%</div>
          <div style={{fontSize:12.5,color:Bridge.muted,marginBottom:10}}>Benchmark average: 5–8%</div>
          <ProgressBar value={323} max={400} color={Bridge.red} height={8}/>
        </Card>
        <Card style={{padding:'20px 22px',background:Bridge.accentBg,border:`1px solid ${Bridge.accent}20`}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10}}>System Assessment</div>
          {[['Hardship level','SEVERE'],['Confidence score','94%'],['Assessment method','Open Banking + ML'],['Data period','Oct 2025 – Apr 2026'],['Recommended plan','Conservative (£35/mo)'],['Sustainability','HIGH'],].map(([k,v])=>(
            <Row key={k}><span style={{fontSize:13.5,color:Bridge.sub}}>{k}</span><span style={{fontSize:13.5,fontWeight:600,color:Bridge.text}}>{v}</span></Row>
          ))}
        </Card>
      </div>
    </div>
  );
}

// ── Tab: Bank Data (4.2.4) ─────────────────────────────────────
function BankDataTab() {
  const qualityItems = [['Transaction coverage','6 months complete','high'],['Data gaps','None detected','high'],['Account type','Current account','high'],['Salary pattern','Regular, monthly','high'],['Suspicious patterns','None','high'],['Dormant periods','None','high']];
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 22px'}}>
          <AdminSection title="Bank Connection">
            {[['Bank','Barclays'],['Account type','Current account'],['Account suffix','····1234'],['Connection date','18 Apr 2026, 09:41'],['Connection method','Open Banking (Tink)'],['Status','Active'],['Last sync','20 Apr 2026, 08:00'],].map(([k,v])=>(
              <Row key={k}><span style={{fontSize:13.5,color:Bridge.sub}}>{k}</span><span style={{fontSize:13.5,fontWeight:600,color:Bridge.text}}>{v}</span></Row>
            ))}
          </AdminSection>
        </Card>
        <Card style={{padding:'20px 22px'}}>
          <AdminSection title="Transaction Statistics">
            {[['Total transactions','186'],['Credits (income)','14'],['Debits (spending)','172'],['Largest single debit','£850 (rent)'],['Recurring payments','8 identified'],['Cash withdrawals','£40/month avg'],].map(([k,v])=>(
              <Row key={k}><span style={{fontSize:13.5,color:Bridge.sub}}>{k}</span><span style={{fontSize:13.5,fontWeight:600,color:Bridge.text}}>{v}</span></Row>
            ))}
          </AdminSection>
        </Card>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 22px'}}>
          <div style={{display:'flex',gap:16,alignItems:'center',marginBottom:18}}>
            <div style={{width:72,height:72,borderRadius:'50%',background:Bridge.greenBg,border:`4px solid ${Bridge.green}`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:22,fontWeight:800,color:Bridge.green}}>92</span>
              <span style={{fontSize:9,color:Bridge.green,fontWeight:600}}>/100</span>
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:Bridge.text}}>High quality data</div>
              <div style={{fontSize:13,color:Bridge.sub,marginTop:3}}>Suitable for automated assessment</div>
              <div style={{marginTop:8}}><SustBadge level="HIGH"/></div>
            </div>
          </div>
          {qualityItems.map(([k,v,tier])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:`1px solid ${Bridge.divider}`,alignItems:'center'}}>
              <span style={{fontSize:13,color:Bridge.sub}}>{k}</span>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <span style={{fontSize:13,color:Bridge.text}}>{v}</span>
                <span style={{width:8,height:8,borderRadius:'50%',background:tier==='high'?Bridge.green:Bridge.amber,flexShrink:0}}/>
              </div>
            </div>
          ))}
        </Card>
        <Card style={{padding:'16px 20px',background:Bridge.greenBg,border:`1px solid ${Bridge.green}20`}}>
          <div style={{fontSize:13.5,fontWeight:700,color:'oklch(38% 0.17 145)',marginBottom:4}}>No flags detected</div>
          <div style={{fontSize:13,color:'oklch(42% 0.12 145)',lineHeight:1.5}}>No unusual activity, suspicious patterns, or data quality issues were identified. Assessment confidence is high.</div>
        </Card>
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('overview');
  const TAB_LABELS = {overview:'4.2.1 Overview',customer:'4.2.2 Customer Context',financial:'4.2.3 Financial',bank:'4.2.4 Bank Data'};
  const TABS = Object.entries(TAB_LABELS).map(([id,label])=>({id,label}));
  return (
    <AdminLayout active="cases" title="Case Review" subtitle="Manual review queue › Sarah Mitchell">
      <CaseHeader/>
      <Tabs tabs={TABS} active={tab} onChange={setTab}/>
      {tab==='overview' && <OverviewTab/>}
      {tab==='customer' && <CustomerTab/>}
      {tab==='financial' && <FinancialTab/>}
      {tab==='bank' && <BankDataTab/>}
      {/* Notes */}
      <Card style={{padding:'18px 22px',marginTop:20}}>
        <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:10}}>Officer Notes</div>
        <textarea placeholder="Add your assessment notes here..." style={{width:'100%',minHeight:80,border:`1.5px solid ${Bridge.border}`,borderRadius:12,padding:'10px 14px',fontSize:13.5,fontFamily:"'Plus Jakarta Sans',sans-serif",resize:'vertical',outline:'none',color:Bridge.text}}/>
      </Card>
    </AdminLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
