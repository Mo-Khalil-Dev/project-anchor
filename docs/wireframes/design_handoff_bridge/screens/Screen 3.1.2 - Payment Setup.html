<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge — Payment Setup</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

const METHODS = [
  {
    id:'dd', label:'Direct Debit', badge:'Recommended', badgeColor:Bridge.green,
    desc:'Automatic monthly payment — set it and forget it. Most reliable way to keep your plan on track.',
    icon:<svg width="24" height="20" viewBox="0 0 26 22" fill="none"><rect x="1" y="4" width="24" height="15" rx="3" stroke={Bridge.accent} strokeWidth="1.7" fill={Bridge.accentBg}/><path d="M1 8h24" stroke={Bridge.accent} strokeWidth="1.7"/><rect x="4" y="13" width="6" height="3" rx="1.5" fill={Bridge.accent}/></svg>,
  },
  {
    id:'card', label:'Card or Bank Transfer', badge:'Manual', badgeColor:Bridge.amber,
    desc:'Pay each month manually online or via bank transfer. You\'ll receive a reminder 7 days before each payment.',
    icon:<svg width="24" height="20" viewBox="0 0 26 22" fill="none"><rect x="1" y="4" width="24" height="15" rx="3" stroke={Bridge.sub} strokeWidth="1.7" fill={Bridge.bg}/><path d="M1 8h24" stroke={Bridge.sub} strokeWidth="1.7"/><rect x="4" y="13" width="4" height="3" rx="1.5" fill={Bridge.sub} opacity="0.5"/><rect x="10" y="13" width="6" height="3" rx="1.5" fill={Bridge.sub} opacity="0.5"/></svg>,
  },
  {
    id:'cash', label:'Cash at Post Office', badge:'In-person', badgeColor:Bridge.sub,
    desc:'Pay cash at any Post Office branch with your payment reference. Allow 2 business days for processing.',
    icon:<svg width="24" height="20" viewBox="0 0 26 22" fill="none"><rect x="1" y="4" width="24" height="15" rx="3" stroke={Bridge.sub} strokeWidth="1.7" fill={Bridge.bg}/><path d="M13 8v8M9 10h8M9 14h8" stroke={Bridge.sub} strokeWidth="1.4" strokeLinecap="round"/></svg>,
  },
];

function App() {
  const [selected, setSelected] = useState('dd');
  return (
    <CustomerLayout title="How would you like to pay?" subtitle="Choose your preferred payment method. You can change this at any time." step={2} totalSteps={4}>
      <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:24}}>
        {METHODS.map(m=>(
          <div key={m.id} onClick={()=>setSelected(m.id)} style={{
            background:'#fff', borderRadius:16, padding:'20px 22px',
            border:`${selected===m.id?2:1.5}px solid ${selected===m.id?Bridge.accent:Bridge.border}`,
            cursor:'pointer', display:'grid', gridTemplateColumns:'auto 1fr auto', gap:16, alignItems:'center',
            boxShadow: selected===m.id ? `0 3px 14px ${Bridge.accent}18` : '0 1px 4px rgba(0,0,0,0.05)',
            transition:'all 0.15s',
          }}>
            <div style={{width:48,height:48,borderRadius:14,background:selected===m.id?Bridge.accentBg:Bridge.bg,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {m.icon}
            </div>
            <div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                <span style={{fontSize:15,fontWeight:700,color:Bridge.text}}>{m.label}</span>
                <span style={{fontSize:11.5,fontWeight:600,padding:'2px 8px',borderRadius:100,background:`${m.badgeColor}18`,color:m.badgeColor}}>{m.badge}</span>
              </div>
              <div style={{fontSize:13,color:Bridge.sub,lineHeight:1.5}}>{m.desc}</div>
            </div>
            <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${selected===m.id?Bridge.accent:Bridge.border}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              {selected===m.id && <div style={{width:10,height:10,borderRadius:'50%',background:Bridge.accent}}/>}
            </div>
          </div>
        ))}
      </div>

      {selected==='dd' && (
        <div style={{background:Bridge.greenBg,borderRadius:12,padding:'14px 18px',marginBottom:20,fontSize:13,color:'oklch(38% 0.17 145)',lineHeight:1.55}}>
          ✓ Direct Debit is the most reliable method. Payments are protected by the Direct Debit Guarantee — you can cancel at any time.
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Btn variant="primary" full>Set Up {METHODS.find(m=>m.id===selected)?.label}</Btn>
        <Btn variant="secondary" full>Back</Btn>
      </div>
    </CustomerLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
