<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge — Assessment Breakdown</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

const EXPENSES = [
  { label:'Housing', amount:850, color:'oklch(52% 0.18 270)', pct:49 },
  { label:'Food & groceries', amount:320, color:'oklch(62% 0.16 76)', pct:19 },
  { label:'Transport', amount:220, color:'oklch(52% 0.18 200)', pct:13 },
  { label:'Utilities', amount:180, color:'oklch(52% 0.18 145)', pct:10 },
  { label:'Other', amount:150, color:Bridge.muted, pct:9 },
];

const INCOME_MONTHS = [
  { m:'Nov', v:2100 }, { m:'Dec', v:1850 }, { m:'Jan', v:1750 },
  { m:'Feb', v:1900 }, { m:'Mar', v:1800 }, { m:'Apr', v:1850 },
];

function OverviewTab() {
  const rows = [
    { label:'Salary (regular)', amount:'£1,600', type:'income' },
    { label:'Universal Credit', amount:'£250', type:'income' },
    { label:'Total Income', amount:'£1,850', bold:true, type:'income' },
    null,
    { label:'Housing (rent)', amount:'£850', type:'expense' },
    { label:'Food & groceries', amount:'£320', type:'expense' },
    { label:'Transport', amount:'£220', type:'expense' },
    { label:'Utilities', amount:'£180', type:'expense' },
    { label:'Other essentials', amount:'£150', type:'expense' },
    { label:'Total Expenses', amount:'£1,720', bold:true, type:'expense' },
    null,
    { label:'Disposable Income', amount:'£130', bold:true, type:'disposable' },
  ];
  const typeColor = { income: Bridge.green, expense: Bridge.amber, disposable: Bridge.red };
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <Card style={{padding:'20px 24px'}}>
        <SectionLabel>Income & Expenses</SectionLabel>
        {rows.map((r,i)=> r===null ? (
          <div key={i} style={{height:1,background:Bridge.divider,margin:'8px 0'}}/>
        ) : (
          <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:i<rows.length-1&&rows[i+1]?`1px solid ${Bridge.divider}`:'none'}}>
            <span style={{fontSize:13.5,color:r.bold?Bridge.text:Bridge.sub,fontWeight:r.bold?700:400}}>{r.label}</span>
            <span style={{fontSize:13.5,fontWeight:r.bold?700:500,color:r.bold?typeColor[r.type]:Bridge.text}}>{r.amount}</span>
          </div>
        ))}
      </Card>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 24px'}}>
          <SectionLabel>Disposable Income Formula</SectionLabel>
          <div style={{fontSize:13,color:Bridge.sub,lineHeight:1.6,marginTop:4}}>
            Income <span style={{color:Bridge.green,fontWeight:700}}>£1,850</span> minus essential expenses <span style={{color:Bridge.amber,fontWeight:700}}>£1,720</span> leaves <span style={{color:Bridge.red,fontWeight:700}}>£130/month</span> disposable income.
          </div>
          <div style={{marginTop:14,height:8,borderRadius:100,background:'#eee',overflow:'hidden'}}>
            <div style={{height:'100%',width:'7%',background:Bridge.red,borderRadius:100}}/>
          </div>
          <div style={{fontSize:11.5,color:Bridge.muted,marginTop:6}}>7% of income is disposable — well below the 25% healthy threshold</div>
        </Card>
        <Card style={{padding:'20px 24px'}}>
          <SectionLabel>Bill as % of Disposable</SectionLabel>
          <div style={{fontSize:36,fontWeight:800,color:Bridge.red,letterSpacing:-1,marginTop:4}}>323%</div>
          <div style={{fontSize:12.5,color:Bridge.sub,marginTop:4}}>Benchmark average: <strong>5–8%</strong></div>
          <HardshipBadge level="SEVERE" />
        </Card>
        <Card style={{padding:'20px 24px',background:Bridge.accentBg,border:`1px solid ${Bridge.accent}20`}}>
          <div style={{fontSize:13,color:Bridge.accent,lineHeight:1.6}}>
            Your bill of <strong>£420</strong> would need <strong>3.2 months</strong> of your entire disposable income to clear — before any emergencies.
          </div>
        </Card>
      </div>
    </div>
  );
}

function ExpensesTab() {
  const avg = { Housing:720, 'Food & groceries':280, Transport:160, Utilities:140, Other:120 };
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <Card style={{padding:'20px 24px'}}>
        <SectionLabel>Spending by Category</SectionLabel>
        <div style={{display:'flex',flexDirection:'column',gap:12,marginTop:8}}>
          {EXPENSES.map(e=>(
            <div key={e.label}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:13.5,color:Bridge.text,fontWeight:500}}>{e.label}</span>
                <span style={{fontSize:13.5,color:Bridge.text,fontWeight:600}}>£{e.amount}<span style={{fontWeight:400,color:Bridge.muted,fontSize:12}}> / mo</span></span>
              </div>
              <div style={{height:7,borderRadius:100,background:'#eee',overflow:'hidden'}}>
                <div style={{height:'100%',width:`${e.pct}%`,background:e.color,borderRadius:100}}/>
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${Bridge.divider}`,display:'flex',justifyContent:'space-between',fontSize:14,fontWeight:700}}>
          <span>Total</span><span style={{color:Bridge.amber}}>£1,720/mo</span>
        </div>
      </Card>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 24px'}}>
          <SectionLabel>Vs. Average Household (UK)</SectionLabel>
          <div style={{display:'flex',flexDirection:'column',gap:9,marginTop:6}}>
            {EXPENSES.map(e=>(
              <div key={e.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13}}>
                <span style={{color:Bridge.sub,width:120}}>{e.label}</span>
                <div style={{display:'flex',gap:16}}>
                  <span style={{color:Bridge.text,fontWeight:600,width:40,textAlign:'right'}}>£{e.amount}</span>
                  <span style={{color:Bridge.muted,width:40,textAlign:'right'}}>£{avg[e.label]}</span>
                  <span style={{color:e.amount>avg[e.label]?Bridge.red:Bridge.green,fontWeight:600,width:44,textAlign:'right'}}>{e.amount>avg[e.label]?'+':''}£{e.amount-avg[e.label]}</span>
                </div>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'flex-end',gap:16,fontSize:11.5,color:Bridge.muted,marginTop:2}}>
              <span style={{width:40,textAlign:'right'}}>Yours</span>
              <span style={{width:40,textAlign:'right'}}>Avg</span>
              <span style={{width:44,textAlign:'right'}}>Diff</span>
            </div>
          </div>
        </Card>
        <Card style={{padding:'16px 20px',background:Bridge.amberBg,border:`1px solid ${Bridge.amber}30`}}>
          <div style={{fontSize:13,color:'oklch(45% 0.16 76)',lineHeight:1.6}}>
            Housing costs are <strong>£130 above average</strong> — the biggest driver of your tight budget. This may be worth discussing with a debt adviser.
          </div>
        </Card>
      </div>
    </div>
  );
}

function IncomeTab() {
  const W=480,H=160,pad=40;
  const min=1400,max=2400,range=max-min;
  const pts = INCOME_MONTHS.map((d,i)=>({
    x: pad + (i/(INCOME_MONTHS.length-1))*(W-pad*2),
    y: pad + (1-(d.v-min)/range)*(H-pad*2),
    ...d
  }));
  const pathD = pts.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const avgY = pad + (1-(1850-min)/range)*(H-pad*2);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <Card style={{padding:'20px 24px'}}>
        <SectionLabel>6-Month Income Chart</SectionLabel>
        <svg width="100%" viewBox={`0 0 ${W} ${H+20}`} style={{overflow:'visible',marginTop:8}}>
          {/* Grid lines */}
          {[1600,1800,2000,2200].map(v=>{
            const y=pad+(1-(v-min)/range)*(H-pad*2);
            return <g key={v}><line x1={pad} y1={y} x2={W-pad} y2={y} stroke={Bridge.divider} strokeWidth="1"/><text x={pad-8} y={y+4} fontSize="10" fill={Bridge.muted} textAnchor="end">£{v}</text></g>;
          })}
          {/* Avg line */}
          <line x1={pad} y1={avgY} x2={W-pad} y2={avgY} stroke={Bridge.accent} strokeWidth="1.5" strokeDasharray="5,4"/>
          <text x={W-pad+6} y={avgY+4} fontSize="10" fill={Bridge.accent}>avg</text>
          {/* Area fill */}
          <defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={Bridge.accent} stopOpacity="0.15"/><stop offset="100%" stopColor={Bridge.accent} stopOpacity="0"/></linearGradient></defs>
          <path d={`${pathD} L ${pts[pts.length-1].x} ${H-pad+pad} L ${pts[0].x} ${H-pad+pad} Z`} fill="url(#ig)"/>
          {/* Line */}
          <path d={pathD} stroke={Bridge.accent} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
          {/* Dots + labels */}
          {pts.map(p=>(
            <g key={p.m}>
              <circle cx={p.x} cy={p.y} r="5" fill={Bridge.accent} stroke="#fff" strokeWidth="2"/>
              <text x={p.x} y={H+16} fontSize="11" fill={Bridge.muted} textAnchor="middle">{p.m}</text>
            </g>
          ))}
        </svg>
      </Card>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Card style={{padding:'20px 24px'}}>
          <SectionLabel>Income Summary</SectionLabel>
          {[{l:'Average monthly income',v:'£1,850'},{l:'Highest month (Nov)',v:'£2,100'},{l:'Lowest month (Jan)',v:'£1,750'},{l:'Variance',v:'£350'},{l:'Stability',v:'Moderate'}].map(r=>(
            <Row key={r.l}><span style={{fontSize:13.5,color:Bridge.sub}}>{r.l}</span><span style={{fontSize:13.5,fontWeight:600,color:Bridge.text}}>{r.v}</span></Row>
          ))}
        </Card>
        <Card style={{padding:'16px 20px',background:'oklch(97% 0.04 145)',border:`1px solid ${Bridge.green}30`}}>
          <div style={{fontSize:13,color:'oklch(38% 0.17 145)',lineHeight:1.6}}>
            Income is <strong>moderately stable</strong> — regular salary plus benefits. The November spike likely reflects an annual bonus or holiday pay.
          </div>
        </Card>
      </div>
    </div>
  );
}

function WhyTab() {
  const factors = [
    {n:1,title:'High housing costs',detail:'Your rent of £850/mo is £130 above the regional average for a similar property. This is the primary driver of your tight disposable income.',color:Bridge.red,severity:'High'},
    {n:2,title:'Low disposable income',detail:'After essential spending, only £130/month remains. This means even a small unexpected expense (car, medical) pushes you into deficit.',color:Bridge.amber,severity:'Medium'},
    {n:3,title:'Arrears accumulating interest',detail:'The £420 outstanding balance has been accruing. Each month without a plan adds further pressure to an already strained budget.',color:Bridge.amber,severity:'Medium'},
  ];
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {factors.map(f=>(
        <Card key={f.n} style={{padding:'22px 24px',borderLeft:`4px solid ${f.color}`}}>
          <div style={{display:'flex',gap:16,alignItems:'flex-start'}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:`${f.color}18`,color:f.color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:16,flexShrink:0}}>{f.n}</div>
            <div style={{flex:1}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <div style={{fontSize:15,fontWeight:700,color:Bridge.text}}>{f.title}</div>
                <span style={{fontSize:11.5,fontWeight:600,padding:'3px 10px',borderRadius:100,background:`${f.color}18`,color:f.color}}>{f.severity} impact</span>
              </div>
              <div style={{fontSize:13.5,color:Bridge.sub,lineHeight:1.6}}>{f.detail}</div>
            </div>
          </div>
        </Card>
      ))}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {[
          {period:'Short-term',actions:['Set up a payment plan','Contact debt advice service'],color:Bridge.red},
          {period:'Medium-term',actions:['Review housing costs','Apply for Warm Home Discount'],color:Bridge.amber},
          {period:'Long-term',actions:['Build emergency fund','Review benefits entitlement'],color:Bridge.green},
        ].map(s=>(
          <Card key={s.period} style={{padding:'16px 18px'}}>
            <div style={{fontSize:11.5,fontWeight:700,color:s.color,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>{s.period}</div>
            {s.actions.map(a=><div key={a} style={{display:'flex',alignItems:'flex-start',gap:7,marginBottom:7}}><span style={{color:s.color,fontWeight:700,fontSize:14,lineHeight:1}}>·</span><span style={{fontSize:13,color:Bridge.sub,lineHeight:1.45}}>{a}</span></div>)}
          </Card>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab,setTab]=useState('overview');
  const TABS=[{id:'overview',label:'Overview'},{id:'expenses',label:'Expenses'},{id:'income',label:'Income Stability'},{id:'why',label:'Why This Happened'}];
  return (
    <CustomerLayout title="Detailed Assessment Breakdown" subtitle="A full breakdown of your financial position based on bank data from Barclays.">
      <Tabs tabs={TABS} active={tab} onChange={setTab}/>
      {tab==='overview'&&<OverviewTab/>}
      {tab==='expenses'&&<ExpensesTab/>}
      {tab==='income'&&<IncomeTab/>}
      {tab==='why'&&<WhyTab/>}
      <div style={{marginTop:24,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Btn variant="primary" full>View Payment Plan Options</Btn>
        <Btn variant="secondary" full>Back to Overview</Btn>
      </div>
    </CustomerLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
