<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bridge — Plan Terms</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../bridge-ui.jsx"></script>
<script type="text/babel">
const { useState } = React;

const TERMS = [
  { heading:'What you\'re agreeing to', items:[
    'You will pay £35 on the 15th of each month, starting 15 May 2026.',
    'This plan runs for 12 months and clears your full £420 balance.',
    'There is no interest added to your balance while the plan is active.',
  ]},
  { heading:'If you miss a payment', items:[
    'We will contact you — we will not immediately report to credit agencies.',
    'You can reschedule up to 2 payments per year without penalty.',
    'After 2 missed payments without contact, the plan may be reviewed.',
  ]},
  { heading:'Your rights', items:[
    'You can pause the plan at any time by calling 0800 000 0000.',
    'You can pay off the balance early at any time — no early repayment fee.',
    'You can request a reassessment if your financial situation changes.',
    'You can cancel within 14 days for a full refund of any payments made.',
  ]},
  { heading:'Your data', items:[
    'Bank transaction data is stored securely and deleted after 3 years.',
    'Your data is not sold to third parties.',
    'You can request deletion under GDPR at any time.',
  ]},
];

function App() {
  const [accepted, setAccepted] = useState(false);
  return (
    <CustomerLayout title="Plan Agreement" subtitle="Please read these terms — they're written in plain English, not legal jargon." step={1} totalSteps={4}>
      {/* Plan summary strip */}
      <Card style={{padding:'16px 20px',marginBottom:20,background:Bridge.accentBg,border:`1px solid ${Bridge.accent}20`}}>
        <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
          {[['Plan','Conservative'],['Monthly payment','£35'],['Duration','12 months'],['Total','£420'],['First payment','15 May 2026']].map(([k,v])=>(
            <div key={k}><div style={{fontSize:11,color:Bridge.accent,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{k}</div><div style={{fontSize:15,fontWeight:700,color:Bridge.text}}>{v}</div></div>
          ))}
        </div>
      </Card>

      {TERMS.map(section=>(
        <Card key={section.heading} style={{marginBottom:12,padding:'18px 22px'}}>
          <div style={{fontSize:13.5,fontWeight:700,color:Bridge.text,marginBottom:12}}>{section.heading}</div>
          {section.items.map(item=>(
            <div key={item} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'6px 0',borderBottom:`1px solid ${Bridge.divider}`}}>
              <span style={{width:5,height:5,borderRadius:'50%',background:Bridge.accent,flexShrink:0,marginTop:7}}/>
              <span style={{fontSize:13.5,color:Bridge.sub,lineHeight:1.55}}>{item}</span>
            </div>
          ))}
        </Card>
      ))}

      <Card style={{padding:'20px 22px',marginBottom:20,marginTop:8}}>
        <label style={{display:'flex',gap:14,alignItems:'flex-start',cursor:'pointer'}}>
          <input type="checkbox" checked={accepted} onChange={e=>setAccepted(e.target.checked)} style={{width:18,height:18,marginTop:2,accentColor:Bridge.accent,flexShrink:0}}/>
          <div>
            <div style={{fontSize:14,fontWeight:600,color:Bridge.text,marginBottom:4}}>I accept this payment plan</div>
            <div style={{fontSize:13,color:Bridge.sub,lineHeight:1.5}}>I have read and understood the terms above. I agree to pay £35/month starting 15 May 2026 and understand my rights.</div>
          </div>
        </label>
      </Card>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Btn variant="primary" full disabled={!accepted}>Continue to Payment Setup</Btn>
        <Btn variant="secondary" full>Go Back</Btn>
      </div>
    </CustomerLayout>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
